<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MySoulMate">
  <!--
    탭에서 16px로 줄어들어도 알아볼 수 있어야 해서 형태를 하나만 쓴다.
    말풍선 꼬리나 글자를 얹으면 그 크기에서 뭉개진다.
    색은 앱의 blush(#d98c8c) 계열을 그대로 쓴다.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e29c9c" />
      <stop offset="1" stop-color="#c97b7b" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#g)" />

  <path
    d="M32 48.5C32 48.5 13.5 37.2 13.5 25.8C13.5 19.6 18.1 15.5 23.4 15.5C27.1 15.5 30.4 17.6 32 20.6C33.6 17.6 36.9 15.5 40.6 15.5C45.9 15.5 50.5 19.6 50.5 25.8C50.5 37.2 32 48.5 32 48.5Z"
    fill="#fff"
  />
</svg>
